name: Client site monitor

# Runs the Selenium checks against the live client site on a timer.
# If anything breaks, this run fails and GitHub emails the repo owner.
# It is separate from the portfolio E2E workflow on purpose, so an issue
# on the client's site never turns the portfolio badge red.

on:
  schedule:
    - cron: '0 13 * * *'   # once a day, around 9am Halifax time
  workflow_dispatch:

jobs:
  monitor:
    name: Client site checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run client site checks
        run: npm run test:client-site
        env:
          CLIENT_SITE_URL: ${{ secrets.CLIENT_SITE_URL }}
          CLIENT_PAGE_PATH: ${{ secrets.CLIENT_PAGE_PATH }}
          CLIENT_IGNORE_ERROR_PATTERNS: ${{ secrets.CLIENT_IGNORE_ERROR_PATTERNS }}

      - name: Notify phone on failure (ntfy)
        if: failure()
        run: |
          curl -s \
            -H "Title: Client site monitor failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Client site check failed. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
